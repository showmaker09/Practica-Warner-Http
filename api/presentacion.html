<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas y Usuarios</title>
    <style>
        body { font-family: sans-serif; margin: 2em; background-color: #f8f9fa; }
        h1, h2, h3 { color: #343a40; }
        #recetas-container, #usuarios-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1em; margin-top: 1em; }
        .item { background-color: white; border: 1px solid #dee2e6; border-radius: 0.25rem; padding: 1em; }
        .item h4 { margin-top: 0; color: #495057; }
        button { background-color: #007bff; color: white; border: none; padding: 0.5em 1em; border-radius: 0.25rem; cursor: pointer; font-size: 1em; margin-right: 0.5em; }
        button:hover { background-color: #0056b3; }
        .btn-edit { background-color: #ffc107; color: #212529; }
        .btn-edit:hover { background-color: #e0a800; }
        form { background-color: white; padding: 1.5em; border: 1px solid #dee2e6; border-radius: 0.25rem; margin-top: 1em; max-width: 500px; }
        form input, form textarea { width: 100%; padding: 0.5em; margin-bottom: 1em; border: 1px solid #ced4da; border-radius: 0.25rem; box-sizing: border-box; }
        form button { background-color: #28a745; }
        form button:hover { background-color: #218838; }
        hr { margin: 2em 0; }
        #receta-detalle-container, #usuario-detalle-container { margin-top: 1em; }
    </style>
</head>
<body>
    <h1>Gestión de Recetas y Usuarios</h1>

    <hr>

    <h2>Recetas</h2>
    <button id="cargar-recetas">Cargar Recetas</button>
    <div id="recetas-container"></div>

    <hr>

    <h2>Buscar Receta por ID</h2>
    <form id="form-buscar-receta">
        <input type="number" id="buscar-receta-id" placeholder="Introduce el ID de la receta" required>
        <button type="submit">Buscar</button>
    </form>
    <div id="receta-detalle-container"></div>

    <hr>

    <div id="seccion-actualizar-receta" style="display: none;">
        <h2>Actualizar Receta</h2>
        <form id="form-actualizar-receta">
            <input type="hidden" id="actualizar-receta-id">
            <input type="text" id="actualizar-receta-nombre" placeholder="Nombre de la receta" required>
            <textarea id="actualizar-receta-descripcion" placeholder="Descripción de la receta" required></textarea>
            <button type="submit">Guardar Cambios</button>
        </form>
    </div>
    
    <h2>Crear Nueva Receta</h2>
    <form id="form-crear-receta">
        <input type="text" id="receta-nombre" placeholder="Nombre de la receta" required>
        <textarea id="receta-descripcion" placeholder="Descripción de la receta" required></textarea>
        <input type="number" id="receta-id-usuario" placeholder="ID del Usuario" required>
        <button type="submit">Guardar Receta</button>
    </form>

    <hr>

    <h2>Usuarios</h2>
    <button id="cargar-usuarios">Cargar Usuarios</button>
    <div id="usuarios-container"></div>

    <hr>

    <h2>Buscar Usuario por ID</h2>
    <form id="form-buscar-usuario">
        <input type="number" id="buscar-usuario-id" placeholder="Introduce el ID del usuario" required>
        <button type="submit">Buscar</button>
    </form>
    <div id="usuario-detalle-container"></div>

    <h2>Crear Nuevo Usuario</h2>
    <form id="form-crear-usuario">
        <input type="text" id="usuario-nombre" placeholder="Nombre del usuario" required>
        <button type="submit">Guardar Usuario</button>
    </form>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        // --- RECETAS ---
        const cargarRecetasBtn = document.getElementById('cargar-recetas');
        const recetasContainer = document.getElementById('recetas-container');
        const formCrearReceta = document.getElementById('form-crear-receta');
        const formBuscarReceta = document.getElementById('form-buscar-receta');
        const recetaDetalleContainer = document.getElementById('receta-detalle-container');
        const seccionActualizar = document.getElementById('seccion-actualizar-receta');
        const formActualizarReceta = document.getElementById('form-actualizar-receta');


        const fetchAndDisplayRecetas = () => {
            fetch(`${API_BASE_URL}/recetas`)
                .then(response => response.ok ? response.json() : Promise.reject('Error al cargar recetas'))
                .then(recetas => {
                    recetasContainer.innerHTML = '';
                    recetas.forEach(receta => {
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.innerHTML = `
                            <h4>${receta.nombre} (ID: ${receta.id_receta})</h4>
                            <p><strong>Descripción:</strong> ${receta.descripcion || 'No disponible'}</p>
                            <p><strong>Usuario ID:</strong> ${receta.id_usuario}</p>
                            <button class="btn-edit" data-id="${receta.id_receta}" data-nombre="${receta.nombre}" data-descripcion="${receta.descripcion || ''}">Editar</button>
                        `;
                        recetasContainer.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error en recetas:', error);
                    recetasContainer.innerHTML = '<p>No se pudieron cargar las recetas.</p>';
                });
        };

        cargarRecetasBtn.addEventListener('click', fetchAndDisplayRecetas);

        formCrearReceta.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('receta-nombre').value;
            const descripcion = document.getElementById('receta-descripcion').value;
            const id_usuario = document.getElementById('receta-id-usuario').value;

            fetch(`${API_BASE_URL}/recetas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, descripcion, id_usuario })
            })
            .then(response => response.ok ? response.json() : Promise.reject('Error al crear receta'))
            .then(() => {
                formCrearReceta.reset();
                fetchAndDisplayRecetas();
            })
            .catch(error => console.error('Error creando receta:', error));
        });

        formBuscarReceta.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('buscar-receta-id').value;
            recetaDetalleContainer.innerHTML = '';

            fetch(`${API_BASE_URL}/recetas/${id}`)
                .then(response => {
                    if (response.status === 404) return Promise.reject('Receta no encontrada');
                    return response.ok ? response.json() : Promise.reject('Error en la búsqueda');
                })
                .then(receta => {
                    recetaDetalleContainer.innerHTML = `
                        <div class="item">
                            <h4>${receta.nombre} (ID: ${receta.id_receta})</h4>
                            <p><strong>Descripción:</strong> ${receta.descripcion || 'No disponible'}</p>
                            <p><strong>Usuario ID:</strong> ${receta.id_usuario}</p>
                            ${receta.ingredientes ? `<p><strong>Ingredientes:</strong> ${receta.ingredientes.map(i => i.nombre).join(', ')}</p>` : ''}
                            ${receta.pasos ? `<p><strong>Pasos:</strong> ${receta.pasos.map(p => p.descripcion).join('<br>')}</p>` : ''}
                        </div>
                    `;
                })
                .catch(error => {
                    recetaDetalleContainer.innerHTML = `<p>${error}</p>`;
                });
        });
        
        recetasContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-edit')) {
                const id = e.target.dataset.id;
                const nombre = e.target.dataset.nombre;
                const descripcion = e.target.dataset.descripcion;

                document.getElementById('actualizar-receta-id').value = id;
                document.getElementById('actualizar-receta-nombre').value = nombre;
                document.getElementById('actualizar-receta-descripcion').value = descripcion;

                seccionActualizar.style.display = 'block';
                document.getElementById('actualizar-receta-nombre').focus();
            }
        });

        formActualizarReceta.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('actualizar-receta-id').value;
            const nombre = document.getElementById('actualizar-receta-nombre').value;
            const descripcion = document.getElementById('actualizar-receta-descripcion').value;

            fetch(`${API_BASE_URL}/recetas/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, descripcion })
            })
            .then(response => response.ok ? response.json() : Promise.reject('Error al actualizar'))
            .then(() => {
                seccionActualizar.style.display = 'none';
                formActualizarReceta.reset();
                fetchAndDisplayRecetas();
            })
            .catch(error => console.error('Error actualizando:', error));
        });


        // --- USUARIOS ---
        const cargarUsuariosBtn = document.getElementById('cargar-usuarios');
        const usuariosContainer = document.getElementById('usuarios-container');
        const formCrearUsuario = document.getElementById('form-crear-usuario');
        const formBuscarUsuario = document.getElementById('form-buscar-usuario');
        const usuarioDetalleContainer = document.getElementById('usuario-detalle-container');

        const fetchAndDisplayUsuarios = () => {
            fetch(`${API_BASE_URL}/usuarios`)
                .then(response => response.ok ? response.json() : Promise.reject('Error al cargar usuarios'))
                .then(usuarios => {
                    usuariosContainer.innerHTML = '';
                    usuarios.forEach(usuario => {
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.innerHTML = `
                            <h3>${usuario.nombre}</h3>
                            <p><strong>ID:</strong> ${usuario.id_usuario}</p>
                            <p><strong>Cantidad de Recetas:</strong> ${usuario.cantidad_recetas}</p>
                        `;
                        usuariosContainer.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error en usuarios:', error);
                    usuariosContainer.innerHTML = '<p>No se pudieron cargar los usuarios.</p>';
                });
        };

        cargarUsuariosBtn.addEventListener('click', fetchAndDisplayUsuarios);

        formCrearUsuario.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('usuario-nombre').value;

            fetch(`${API_BASE_URL}/usuarios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre })
            })
            .then(response => response.ok ? response.json() : Promise.reject('Error al crear usuario'))
            .then(() => {
                formCrearUsuario.reset();
                fetchAndDisplayUsuarios();
            })
            .catch(error => console.error('Error creando usuario:', error));
        });

        formBuscarUsuario.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('buscar-usuario-id').value;
            usuarioDetalleContainer.innerHTML = '';

            fetch(`${API_BASE_URL}/usuarios/${id}`)
                .then(response => {
                    if (response.status === 404) return Promise.reject('Usuario no encontrado');
                    return response.ok ? response.json() : Promise.reject('Error en la búsqueda');
                })
                .then(usuario => {
                    usuarioDetalleContainer.innerHTML = `
                        <div class="item">
                            <h4>${usuario.nombre} (ID: ${usuario.id_usuario})</h4>
                            <p><strong>IDs de Recetas Asociadas:</strong> ${usuario.recetas.join(', ') || 'Ninguna'}</p>
                        </div>
                    `;
                })
                .catch(error => {
                    usuarioDetalleContainer.innerHTML = `<p>${error}</p>`;
                });
        });

    </script>
</body>
</html>
